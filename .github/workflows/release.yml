name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [ "$version" != "$lock_version" ]; then
            echo "package.json version ($version) does not match package-lock.json version ($lock_version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Verify release version is new
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists. Nothing to release."
            exit 0
          fi

          if npm view "homebridge-snapshot-sensors@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists on npm. Refusing to publish it again."
            exit 1
          fi

      - name: Verify changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "Could not find release notes for version $VERSION in CHANGELOG.md"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $VERSION"
          git push origin "$tag"

      - name: Extract release notes
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          notes="$(awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {
              found=1
              next
            }
            found && $0 ~ "^## \\[" {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md)"

          if [ -z "$notes" ]; then
            echo "Could not extract release notes for version $VERSION"
            exit 1
          fi

          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "${{ steps.changelog.outputs.notes }}"

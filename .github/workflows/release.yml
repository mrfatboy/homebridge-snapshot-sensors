name: Release Validation

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"

          if [ "$version" != "$lock_version" ]; then
            echo "package.json version ($version) does not match package-lock.json version ($lock_version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Verify release version is new
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release tag $tag already exists. This version has already been released."
            exit 1
          fi

          if npm view "homebridge-snapshot-sensors@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION already exists on npm. Refusing to release it again."
            exit 1
          fi

      - name: Verify changelog entry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "Could not find release notes for version $VERSION in CHANGELOG.md"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run

      - name: Release validation complete
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Release $VERSION passed all automated validation checks."
          echo "Publish this version to npm manually, including 2FA, then run the Finalize Release workflow."

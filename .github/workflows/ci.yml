name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The lockfile is generated on Linux, while this matrix also runs on
      # macOS and Windows. npm's arborist can fail when resolving optional
      # native dependencies from a cross-platform lockfile, especially with
      # the npm cache restored by setup-node.
      # A clean install from package.json avoids that cross-platform state and
      # resolves the correct native optional dependencies for each runner.
      - name: Install dependencies
        run: npm install --include=optional --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

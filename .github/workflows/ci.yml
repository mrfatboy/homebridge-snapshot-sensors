name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # npm can omit platform-specific optional native bindings from
      # node_modules when the lockfile was created on another platform.
      # npm ci preserves the lockfile, then npm install restores the
      # platform-specific optional bindings without changing package.json.
      - run: npm ci
      - run: npm install --include=optional --no-save --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

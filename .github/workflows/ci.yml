name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Do not restore the npm cache here. The Node 22 runners were all
      # failing inside npm/arborist while using the restored cache, while
      # Node 24 completed successfully with the same dependency graph.
      - name: Clean npm cache
        run: npm cache clean --force
      # The lockfile is generated on Linux, while this matrix also runs on
      # macOS and Windows. Resolve optional native dependencies from
      # package.json without rewriting package-lock.json.
      - name: Install dependencies
        run: npm install --include=optional --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

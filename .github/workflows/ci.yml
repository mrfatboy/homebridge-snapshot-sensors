name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The lockfile is generated on Linux, while this matrix also runs on
      # macOS and Windows. npm ci can reject a cross-platform lockfile when
      # optional native bindings are not represented for the runner platform.
      # Install from package.json without rewriting package-lock.json so npm
      # resolves the correct native optional dependencies for each platform.
      - run: npm install --include=optional --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

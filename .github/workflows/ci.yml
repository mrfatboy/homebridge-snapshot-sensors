name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Use npm 11.6.0 on Node 22
        if: matrix.node-version == 22
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --include=optional --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

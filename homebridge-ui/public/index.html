<script>
  let reverting = false;

  homebridge.showSchemaForm();

  async function validateSnapshotStorage() {
    if (reverting) return;

    const config = await homebridge.getPluginConfig();
    if (!Array.isArray(config)) return;

    let invalidSelection = false;

    const correctedConfig = config.map((platform) => {
      if (!platform || !Array.isArray(platform.streams)) return platform;

      const streams = platform.streams.map((stream) => {
        if (!stream) return stream;

        const hasDirectory = typeof stream.snapshotDirectory === 'string' &&
          stream.snapshotDirectory.trim().length > 0;

        if ((stream.storeSnapshots === 'raw' || stream.storeSnapshots === 'annotate') && !hasDirectory) {
          invalidSelection = true;
          return { ...stream, storeSnapshots: 'never' };
        }

        return stream;
      });

      return { ...platform, streams };
    });

    if (!invalidSelection) return;

    reverting = true;

    try {
      await homebridge.updatePluginConfig(correctedConfig);
      homebridge.toast.warning(
        'A Snapshot Directory is required before you can select Raw or Annotate. The setting has been changed back to Never.',
        'Snapshot Directory Required'
      );
    } finally {
      reverting = false;
    }
  }

  // configChanged is the normal event from the schema form. The DOM listener
  // provides immediate protection when the select itself is changed.
  homebridge.addEventListener('configChanged', validateSnapshotStorage);

  document.addEventListener('change', async (event) => {
    const select = event.target;
    if (!(select instanceof HTMLSelectElement)) return;

    const values = Array.from(select.options).map((option) => option.value);
    if (!values.includes('raw') || !values.includes('annotate')) return;
    if (select.value !== 'raw' && select.value !== 'annotate') return;

    const config = await homebridge.getPluginConfig();
    const streams = config?.[0]?.streams;
    if (!Array.isArray(streams)) return;

    const hasDirectory = streams.some((stream) =>
      typeof stream?.snapshotDirectory === 'string' && stream.snapshotDirectory.trim().length > 0
    );

    if (hasDirectory) return;

    event.preventDefault();
    reverting = true;

    try {
      select.value = 'never';
      await validateSnapshotStorage();
      homebridge.toast.warning(
        'Enter a Snapshot Directory before selecting Raw or Annotate.',
        'Snapshot Directory Required'
      );
    } finally {
      reverting = false;
    }
  }, true);
</script>

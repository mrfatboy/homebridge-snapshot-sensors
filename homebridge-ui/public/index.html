<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snapshot Sensors</title>
</head>
<body>
<script>
  let correcting = false;

  homebridge.showSchemaForm();

  homebridge.addEventListener('configChanged', async (event) => {
    if (correcting) return;

    const config = event.data;
    if (!Array.isArray(config)) return;

    let changed = false;

    const correctedConfig = config.map((platform) => {
      if (!platform || !Array.isArray(platform.streams)) return platform;

      return {
        ...platform,
        streams: platform.streams.map((stream) => {
          if (!stream) return stream;

          const hasDirectory = typeof stream.snapshotDirectory === 'string' &&
            stream.snapshotDirectory.trim().length > 0;

          if (!hasDirectory &&
              (stream.storeSnapshots === 'raw' || stream.storeSnapshots === 'annotate')) {
            changed = true;
            return { ...stream, storeSnapshots: 'never' };
          }

          return stream;
        })
      };
    });

    if (!changed) return;

    correcting = true;

    try {
      await homebridge.updatePluginConfig(correctedConfig);
      window.alert(
        'Snapshot Directory Required\n\nEnter a Snapshot Directory before selecting Raw or Annotate. The Store snapshots setting has been changed back to Never.'
      );
    } finally {
      correcting = false;
    }
  });
</script>
</body>
</html>

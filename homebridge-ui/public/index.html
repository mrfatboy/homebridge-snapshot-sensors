<style>
  .snapshot-card { margin-bottom: 1rem; }
  .sensor-card { margin-top: .75rem; }
  .help-text { font-size: .9rem; opacity: .75; }
  .button-row { display: flex; gap: .5rem; flex-wrap: wrap; }
</style>

<div class="card card-body">
  <h3>Snapshot Sensors</h3>
  <p class="help-text">Expose camera snapshots as HomeKit motion sensors using on-device object detection.</p>
  <div id="snapshots"></div>
  <div class="button-row mt-3">
    <button id="addSnapshot" type="button" class="btn btn-primary">➕ ADD SNAPSHOT</button>
    <button id="testPopupButton" type="button" class="btn btn-secondary">TEST POPUP</button>
  </div>
  <hr>
  <h5>How sensors work</h5>
  <div class="help-text">Each <strong>Sensor</strong> becomes one HomeKit motion sensor that triggers when any selected category is detected above the threshold.</div>
</div>

<div class="modal fade" id="snapshotModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Test Snapshot</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body text-center"><img id="snapshotResult" alt="Snapshot" style="max-width:100%;height:auto;"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const snapshots = document.querySelector('#snapshots');
  function sensorHtml() { return `<div class="card card-body sensor-card"><div class="d-flex justify-content-between align-items-center mb-2"><strong>📡 Sensor</strong><button type="button" class="btn btn-sm btn-outline-danger remove-sensor">REMOVE</button></div><div class="form-group mb-3"><label>Categories</label><div class="form-check"><input class="form-check-input category" type="checkbox" value="animals"><label class="form-check-label">🐶 Animals</label></div><div class="form-check"><input class="form-check-input category" type="checkbox" value="people"><label class="form-check-label">🧍 People</label></div><div class="form-check"><input class="form-check-input category" type="checkbox" value="vehicles"><label class="form-check-label">🚗 Vehicles</label></div></div><div class="form-group mb-3"><label>✏️ Name (optional)</label><input class="form-control sensor-name" type="text" placeholder="Auto"></div><div class="form-group mb-3"><label>🎚️ Threshold (optional)</label><input class="form-control sensor-threshold" type="number" min="0" max="1" step="0.01" placeholder="0.5"></div><div class="form-check mb-2"><input class="form-check-input sensor-log" type="checkbox"><label class="form-check-label">📝 Log sensor status changes</label></div></div>`; }
  function snapshotHtml() { return `<div class="card snapshot-card"><div class="card-header d-flex justify-content-between align-items-center"><strong>📷 Your Snapshot sensor</strong><button type="button" class="btn btn-sm btn-outline-danger remove-snapshot">REMOVE</button></div><div class="card-body"><div class="form-group mb-3"><label>🏷️ Snapshot sensor name</label><input class="form-control snapshot-name" type="text" placeholder="CameraSensor1"></div><div class="form-group mb-3"><label>🔗 Snapshot URL</label><input class="form-control snapshot-url" type="url" placeholder="http://192.168.1.50:88/cgi-bin/CGIProxy.fcgi?cmd=snapPicture2&usr=USERNAME&pwd=PASSWORD"></div><div class="form-group mb-3"><button type="button" class="btn btn-outline-secondary test-snapshot">📸 Test Snapshot</button></div><div class="form-group mb-3"><label>📁 Snapshot Directory</label><input class="form-control snapshot-directory" type="text" placeholder="/path/to/snapshots"><div class="mt-2"><button type="button" class="btn btn-outline-secondary test-directory">📁 Test Directory</button></div></div><div class="form-group mb-3"><label>💾 Store snapshots</label><select class="form-control store-snapshots"><option value="never">Never</option><option value="raw">Raw</option><option value="annotate">Annotate</option></select></div><div class="sensors"></div><button type="button" class="btn btn-outline-primary add-sensor">➕ ADD SENSOR</button></div></div>`; }
  function addSnapshot() { snapshots.insertAdjacentHTML('beforeend', snapshotHtml()); }

  snapshots.addEventListener('change', event => {
    if (!event.target.classList.contains('store-snapshots')) return;
    const snapshot = event.target.closest('.snapshot-card');
    if ((event.target.value === 'raw' || event.target.value === 'annotate') && !snapshot.querySelector('.snapshot-directory').value.trim()) {
      event.target.value = 'never';
      homebridge.toast.warning('Please fill in the Snapshot Directory before selecting Raw or Annotate.', 'Snapshot Directory Required');
    }
  });

  snapshots.addEventListener('click', async event => {
    const snapshot = event.target.closest('.snapshot-card'); if (!snapshot) return;
    if (event.target.closest('.remove-snapshot')) { snapshot.remove(); return; }

    if (event.target.closest('.test-snapshot')) {
      const button = event.target.closest('.test-snapshot');
      const url = snapshot.querySelector('.snapshot-url').value.trim();
      const directory = snapshot.querySelector('.snapshot-directory').value.trim();
      if (!url) { homebridge.toast.error('Please enter a valid Snapshot URL.', 'Invalid Snapshot URL'); return; }
      if (!directory) { homebridge.toast.error('Please enter a Snapshot Directory.', 'Invalid Snapshot Directory'); return; }
      button.disabled = true; const originalText = button.textContent; button.textContent = '📸 Testing...';
      try {
        const result = await homebridge.request('/test-snapshot', { url, directory });
        if (!result?.image) throw new Error('The camera did not return an image.');
        document.querySelector('#snapshotResult').src = `data:${result.contentType || 'image/jpeg'};base64,${result.image}`;
        const modal = document.querySelector('#snapshotModal');
        modal.classList.add('show'); modal.style.display = 'block'; modal.removeAttribute('aria-hidden');
        const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop fade show'; document.body.appendChild(backdrop);
        const close = () => { modal.classList.remove('show'); modal.style.display = 'none'; modal.setAttribute('aria-hidden', 'true'); backdrop.remove(); };
        modal.querySelectorAll('[data-bs-dismiss="modal"], .btn-close').forEach(el => el.onclick = close);
        if (result.saved === false) homebridge.toast.warning('The Snapshot Directory is empty, so the snapshot was not saved. The snapshot is displayed above.', 'Snapshot Directory Empty');
      } catch (error) {
        console.error('Test Snapshot failed:', error);
        homebridge.toast.error(error?.message || 'Unable to retrieve or save the snapshot.', 'Test Snapshot Failed');
      } finally { button.disabled = false; button.textContent = originalText; }
      return;
    }

    if (event.target.closest('.test-directory')) {
      const button = event.target.closest('.test-directory');
      const directory = snapshot.querySelector('.snapshot-directory').value.trim();
      if (!directory) { homebridge.toast.error('Please enter a Snapshot Directory.', 'Invalid Snapshot Directory'); return; }
      button.disabled = true; const originalText = button.textContent; button.textContent = '📁 Testing...';
      try {
        const result = await homebridge.request('/browse', { path: directory });
        homebridge.toast.success(`Directory is accessible. ${result.directories?.length || 0} subdirectories found.`, 'Test Directory');
      } catch (error) {
        console.error('Test Directory failed:', error);
        homebridge.toast.error(error?.message || 'Unable to access the Snapshot Directory.', 'Test Directory Failed');
      } finally { button.disabled = false; button.textContent = originalText; }
      return;
    }

    if (event.target.closest('.add-sensor')) { const sensors = snapshot.querySelector('.sensors'); sensors.insertAdjacentHTML('beforeend', sensorHtml()); return; }
    if (event.target.closest('.remove-sensor')) event.target.closest('.sensor-card').remove();
  });
  document.querySelector('#addSnapshot').addEventListener('click', addSnapshot);
  document.querySelector('#testPopupButton').addEventListener('click', () => homebridge.toast.success('Test popup works!', 'Success'));
  addSnapshot();
})();
</script>

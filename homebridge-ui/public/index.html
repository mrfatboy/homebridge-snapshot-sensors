<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapshot Sensors</title>
  <link rel="stylesheet" href="snapshot-sensors.css">
</head>
<body>
  <div class="card card-body">
    <h3>Snapshot Sensors</h3>
    <p class="help-text">Expose camera snapshots as HomeKit motion sensors using on-device object detection. Each <strong>Sensor</strong> becomes one HomeKit motion sensor that triggers when any selected category is detected above the threshold.</p>
    <div id="snapshots"></div>
    <div class="button-row mt-3"><button id="addSnapshot" type="button" class="btn btn-primary">➕ ADD ANOTHER SNAPSHOT SENSOR</button></div>
  </div>

  <div class="modal fade" id="snapshotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Test Snapshot</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center"><img id="snapshotResult" alt="Snapshot" style="max-width:100%;height:auto;"></div>
      </div>
    </div>
  </div>

  <script src="snapshot-sensors.js"></script>
  <script src="snapshot-sensors-config.js?v=pushsafer1"></script>
  <script src="snapshot-webhook.js?v=1"></script>
  <script src="pushcut.js?v=1"></script>
  <script src="snapshot-directory-browser.js?v=1"></script>
</body>
</html>
